[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-ai-wiki"
version = "0.6"
description = "基于文档的知识库AI查询系统"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5,<1.0.0",
  "click>=8.2.1,<9.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "gradio>=6.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "litellm==1.89.1",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "pymupdf==1.26.4",
  "PyPDF2==3.0.1",
  "python-dotenv==1.0.1",
  "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
]
