[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-ai-wiki"
version = "0.6"
description = "基于文档的知识库AI查询系统"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5,<1.0.0",
  "click>=8.2.1,<9.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "gradio>=6.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "litellm==1.89.1",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "pymupdf==1.26.4",
  "PyPDF2==3.0.1",
  "python-dotenv==1.0.1",
  "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "mypy>=1.11.0,<2.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["vendor", "index", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "I001"]

[tool.ruff.lint.per-file-ignores]
".aipython/*.py" = ["E402"]
"src/auth/service.py" = ["F841"]
"src/ui/pages.py" = ["F401", "F841"]
"tests/unit/test_ui.py" = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_untyped_defs = true
check_untyped_defs = false
exclude = "^(vendor|index|dist|build)/"

[[tool.mypy.overrides]]
module = [
  "src.db.*",
  "src.rules.*",
  "src.quality.service",
  "src.quality.templates",
  "src.pageindex.service",
  "src.pageindex.evidence_judge",
  "src.pageindex.templates",
]
ignore_errors = true
