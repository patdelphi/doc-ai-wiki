name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DOC_AI_WIKI_INITIAL_ADMIN_PASSWORD: ""
      LLM_PROVIDER: disabled
      LLM_MODEL: disabled
      EMBEDDING_PROVIDER: local
      RERANK_ENABLED: "false"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests .aipython
      - name: Type check retrieval and PageIndex
        run: python -m mypy src/retrieval src/pageindex src/quality/service.py
      - name: Test
        run: python -m pytest tests --maxfail=1 -q
      - name: Build
        run: python -m build
